application:
  subdomain: cumora1
  background_task: true
  routes:
    - /=http://cumora:5181

services:
  cumora:
    image: embed:cumora-server
    environment:
      - NODE_ENV=production
      - PORT=5181
      - DATABASE_URL=postgres://cumora:__DB_PASSWORD__@postgres:5432/cumora
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=byoa-only-server-llm-disabled
      - AGENT_RUNTIME_SECRET=__AGENT_RUNTIME_SECRET__
      - LAZYCAT_AUTH_ENABLED=true
      - CUMORA_BYOA_ONLY=true
      - ENABLE_SCANNER=false
      - ENABLE_IDLE=false
      - ENABLE_AGENT_POD_GC=false
      - ENABLE_CHROME_PVC_GC=false
      - ENABLE_CLUSTER_MONITOR=false
      - CUMORA_PUBLIC_ORIGIN=https://cumora1.${LAZYCAT_BOX_DOMAIN}
      - CUMORA_AUTH_DONE_URL=https://cumora1.${LAZYCAT_BOX_DOMAIN}/
      - CUMORA_AUTH_RETURN_ALLOWLIST=https://cumora1.${LAZYCAT_BOX_DOMAIN}/
    binds:
      - /lzcapp/var/uploads:/app/server/uploads
    depends_on:
      - postgres
      - redis

  postgres:
    image: registry.lazycat.cloud/lzc/postgres:17-alpine3.20
    environment:
      - POSTGRES_USER=cumora
      - POSTGRES_PASSWORD=__DB_PASSWORD__
      - POSTGRES_DB=cumora
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data

  redis:
    image: registry.lazycat.cloud/edward/library/redis:4c6b9d7b7a334a2e
    command: redis-server --appendonly yes --appendfsync everysec
    binds:
      - /lzcapp/var/redis:/data
